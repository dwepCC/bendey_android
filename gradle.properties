# 8 GB RAM: no subir -Xmx demasiado (Android Studio + Gradle compiten por memoria).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Play Console (2026-09-14) reportó "reducción de recursos optimizada" apagada: desde AGP 8.12
# el shrinker puede rastrear referencias entre codigo y recursos a la vez y tumbar recursos que
# solo usa codigo muerto. Hasta AGP 9.0 (que lo hace default) hay que prenderlo con este flag.
# Requiere isMinifyEnabled + isShrinkResources en true (ya lo estan en app/build.gradle.kts).
android.r8.optimizedResourceShrinking=true
